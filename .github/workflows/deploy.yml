name: Prime Success CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_ci:
        description: 'Skip CI checks before deploy (Emergency only)'
        required: false
        default: false
        type: boolean

concurrency:
  group: primesuccess-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # STEP 1: Code Quality, Lint & Typecheck (CI)
  # ===========================================================================
  step1-code-quality:
    name: "Step 1: Code Quality & Verification (CI)"
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.skip_ci != 'true' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Type Check
        run: npm run typecheck

      - name: Run Unit & Integration Tests
        run: npm test

      - name: Verify Next.js Production Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

  # ===========================================================================
  # STEP 2: Build & Push Docker Image to Registry (Zero Source to VPS)
  # ===========================================================================
  step2-build-and-push-image:
    name: "Step 2: Build & Push Docker Image"
    runs-on: ubuntu-latest
    needs: step1-code-quality
    if: ${{ always() && (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) && (github.event.inputs.skip_ci == 'true' || needs.step1-code-quality.result == 'success') }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Normalize Image Repository Name
        id: repo-name
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.repo-name.outputs.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=sha-

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  # STEP 3: Deploy to VPS (Pulls Image Only — No Source Code on VPS)
  # ===========================================================================
  step3-deploy-vps:
    name: "Step 3: Deploy Image to VPS (Source-Free)"
    runs-on: ubuntu-latest
    needs: step2-build-and-push-image
    if: ${{ always() && (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) && needs.step2-build-and-push-image.result == 'success' }}
    permissions:
      contents: read
    steps:
      - name: Normalize Image Repository Name
        id: repo-name
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH (Pull Image Only)
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_URI: ${{ steps.repo-name.outputs.image }}:latest
          IMAGE_SHA: ${{ steps.repo-name.outputs.image }}:sha-${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST || secrets.SSH_HOST }}
          username: ${{ secrets.VPS_USER || secrets.SSH_USER }}
          key: ${{ secrets.VPS_KEY || secrets.SSH_KEY }}
          port: ${{ secrets.VPS_PORT || secrets.SSH_PORT || 22 }}
          envs: IMAGE_URI,IMAGE_SHA,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            echo "🚀 [Step 3] Starting Prime Success Image Deployment on VPS..."

            # 1. Directory setup (only compose & data files, NO source code)
            mkdir -p /var/www/prime-success/data/resumes
            chmod -R 777 /var/www/prime-success/data
            cd /var/www/prime-success

            # 2. Ensure shared Docker network exists
            echo "🌐 Ensuring Docker network 'app-net' exists..."
            docker network inspect app-net >/dev/null 2>&1 || docker network create app-net

            # 3. Authenticate with GHCR to pull private/public image
            echo "🔑 Authenticating with GitHub Container Registry..."
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # 4. Pull ONLY the compiled Docker image from registry (Zero code transfer)
            echo "📥 Pulling latest pre-built container image: $IMAGE_URI"
            docker pull "$IMAGE_URI"

            # 5. Write/Update source-free production docker-compose
            cat << 'COMPOSE_EOF' > docker-compose.prod.yml
            name: primesuccess

            services:
              web:
                container_name: primesuccess-web
                image: ${PRIME_SUCCESS_IMAGE:-primesuccess-web:latest}
                restart: unless-stopped
                ports:
                  - "${PORT:-8087}:3000"
                env_file:
                  - path: .env
                    required: false
                environment:
                  - NODE_ENV=production
                  - PORT=3000
                  - HOSTNAME=0.0.0.0
                  - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
                  - SMTP_PORT=${SMTP_PORT:-587}
                  - SMTP_USER=${SMTP_USER:-}
                  - SMTP_PASS=${SMTP_PASS:-}
                  - SMTP_FROM=${SMTP_FROM:-}
                  - HR_EMAIL=${HR_EMAIL:-}
                  - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
                  - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
                  - JWT_SECRET=${JWT_SECRET:-}
                volumes:
                  - ./data:/app/data
                healthcheck:
                  test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1"]
                  interval: 30s
                  timeout: 10s
                  retries: 3
                  start_period: 25s
                networks:
                  - app-net

            networks:
              app-net:
                external: true
            COMPOSE_EOF

            # 6. Restart container using the newly pulled image
            echo "🐳 Starting container with pre-built image..."
            PRIME_SUCCESS_IMAGE="$IMAGE_URI" docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # 7. Verification / Health check
            echo "🔍 Verifying primesuccess-web container..."
            sleep 6
            docker ps --filter "name=primesuccess-web" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

            # 8. Clean up unused images to preserve VPS disk space
            echo "🧹 Cleaning unused docker images..."
            docker image prune -f

            echo "✅ Prime Success deployed successfully! VPS received image only (Zero source code)."
